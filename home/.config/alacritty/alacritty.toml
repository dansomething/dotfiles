# https://alacritty.org/config-alacritty.html
# Colors (Jellybeans)
[colors.bright]
black = "#c8c8c8"
blue = "#bddff7"
cyan = "#0bbdb6"
green = "#c8e2b9"
magenta = "#fce2ff"
red = "#ffb2b0"
white = "#feffff"
yellow = "#ffe1af"

[colors.cursor]
cursor = "#ffb472"
text = "#feffff"

[colors.normal]
black = "#a3a3a3"
blue = "#a6cae2"
cyan = "#00a69f"
green = "#a3c38b"
magenta = "#e7cdfb"
red = "#e98885"
white = "#e4e4e4"
yellow = "#ffc68d"

[colors.primary]
background = "#151515"
foreground = "#e8e8d3"

[colors.selection]
background = "#f6f6f6"
text = "#5963a2"

[cursor]
blink_interval = 500

[cursor.style]
blinking = "Always"

[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.normal]
family = "IosevkaTerm Nerd Font"
style = "Regular"

[terminal.shell]
args = ["bash", "-l", "-c", "command -v tmux >/dev/null && tmux new-session -A -s main || { echo 'tmux is not installed. Install it with: brew install tmux'; exec bash; }"]
program = "/usr/bin/env"

[window]
option_as_alt = "Both"
startup_mode = "Fullscreen"
