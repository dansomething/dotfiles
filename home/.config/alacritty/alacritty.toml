# https://alacritty.org/config-alacritty.html
# Colors (Jellybeans)
[colors.bright]
black = "#888888"
blue = "#8197bf"
cyan = "#8fbfdc"
green = "#b9ed67"
magenta = "#f0a0c0"
red = "#de5577"
white = "#ffffff"
yellow = "#fad07a"

[colors.cursor]
cursor = "#b0d0f0"
text = "#151515"

[colors.normal]
black = "#3b3b3b"
blue = "#597bc5"
cyan = "#71b9f8"
green = "#99ad6a"
magenta = "#a037b0"
red = "#cf6a4c"
white = "#adadad"
yellow = "#d8ad4c"

[colors.primary]
background = "#151515"
foreground = "#e8e8d3"

[colors.selection]
background = "#404040"
text = "#e8e8d3"

[cursor]
blink_interval = 500

[cursor.style]
blinking = "Always"

[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

[terminal.shell]
args = ["bash", "-l", "-c", "command -v tmux >/dev/null && tmux new-session -A -s main || { echo 'tmux is not installed. Install it with: brew install tmux'; exec bash; }"]
program = "/usr/bin/env"

[window]
option_as_alt = "Both"
startup_mode = "Fullscreen"
